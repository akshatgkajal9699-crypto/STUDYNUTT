openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nutai
    description: NutAI study tutor
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /nutai/chat:
    post:
      operationId: streamNutAiChat
      tags: [nutai]
      summary: Stream a personalized NutAI response
      description: Streams a response using the learner's recent chat, grade, and current subject.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutAiChatRequest"
      responses:
        "200":
          description: Server-sent events containing response chunks, completion, or an error.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid chat request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: The per-user request limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: NutAI is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NutAiMessage:
      type: object
      properties:
        role:
          type: string
          enum: [student, tutor]
        content:
          type: string
          minLength: 1
          maxLength: 1500
      required:
        - role
        - content
    NutAiChatRequest:
      type: object
      properties:
        grade:
          type: integer
          minimum: 1
          maximum: 13
        subject:
          type: string
          minLength: 1
          maxLength: 80
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/NutAiMessage"
      required:
        - grade
        - subject
        - messages
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

